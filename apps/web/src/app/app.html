<app-chat />

<div class="health-status-bar" aria-live="polite">
  @if (health.isLoading()) {
    <span>Consultando /api/health...</span>
  } @else if (health.error()) {
    <span>Não foi possível consultar /api/health.</span>
  } @else if (health.value(); as value) {
    <span>status: {{ value.status }} · database: {{ value.database }}</span>
  }
</div>
